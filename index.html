<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>澎湖水產飲食課</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4fafc;
            color: #333;
        }

        /* 導覽列 */

        nav {
            height: 70px;
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8%;
            box-shadow: 0 2px 10px #ccc;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #176b87;
        }

        .menu {
    display: flex;
    align-items: center;
    gap: 25px;
}

.menu a {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: #176b87;
    font-weight: bold;
    transition: 0.3s;
}

.menu a:hover {
    transform: translateY(-3px);
}

.menu svg {
    width: 25px;
    height: 25px;
}

        /* SVG 首頁 */

        .hero {
            position: relative;
            overflow: hidden;
            min-height: 650px;
        }

        .hero svg {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: auto;
            padding: 130px 30px 100px;
            text-align: center;
        }

        .hero-content h1 {
            font-size: 48px;
            margin: 20px 0;
            color: #155b73;
        }

        .hero-content p {
            font-size: 21px;
            line-height: 1.8;
            color: #315c6b;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 30px;
            background-color: #176b87;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        /* 課程介紹 */

        .section {
            max-width: 1000px;
            margin: 60px auto;
            padding: 20px;
        }

        .section h2 {
            text-align: center;
            font-size: 32px;
            color: #176b87;
        }

        .section p {
            text-align: center;
            line-height: 2;
            font-size: 18px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 220px;
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px #ddd;
            text-align: center;
        }

        .card h3 {
            color: #176b87;
        }

        footer {
            background-color: #176b87;
            color: white;
            text-align: center;
            padding: 30px;
        }

    </style>
</head>
